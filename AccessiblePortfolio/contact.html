<main id="main-content">

    <section aria-labelledby="contact-heading">

        <h1 id="contact-heading">
            Contact Me
        </h1>

        <p>
            Have a question or professional opportunity?
            You can contact me using the form below.
        </p>


        <form action="#" method="post"
              aria-labelledby="contact-heading">

            <fieldset>

                <legend>
                    Contact Information
                </legend>


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                        aria-required="true"
                        placeholder="Enter your full name">

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        aria-required="true"
                        placeholder="Enter your email address">

                </div>


                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                        aria-required="true"
                        placeholder="Enter the subject">

                </div>


                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                        aria-required="true"
                        placeholder="Write your message">
                    </textarea>

                </div>


                <button
                    type="submit"
                    aria-label="Send contact message">

                    Send Message

                </button>

            </fieldset>

        </form>

    </section>

</main>
